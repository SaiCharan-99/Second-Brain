# Single source of truth for every dependency version.
# R7 analogue for the build: versions live here, never inline in a build script.

[versions]
kotlin              = "2.4.10"
coroutines          = "1.11.0"
serialization       = "1.9.0"
ktor                = "3.5.2"
slf4j               = "2.0.17"
logback             = "1.6.3"
junit               = "6.1.3"
sqlite              = "3.53.4.0"
# Pinned to the version transliteration was validated against (D-029). Any-Latn
# on Telugu/Devanagari was verified before this dependency was accepted.
icu4j               = "77.1"
# Official Anthropic SDK for the JVM. Kotlin uses the Java SDK. Supersedes
# ARCHITECTURE.md section 7's "Ktor" for the Claude transport - see D-044.
anthropic           = "2.59.0"
# Compose Multiplatform, desktop target only (:app, Step 4). The Compose
# compiler plugin is versioned in lockstep with Kotlin itself since Kotlin
# 2.0 - see D-058 - so it reuses `kotlin` above rather than its own entry.
compose             = "1.11.1"

# Steps 5-6 (:integrations): Gmail + Calendar via the official Google API Java
# client, not a hand-rolled REST caller - OAuth token refresh, retry-on-5xx and
# request signing all come for free rather than being reimplemented (D-044 made
# the same call for the Anthropic SDK, for the same reason). Versions found via
# search against Maven Central at implementation time - unverified against a
# real build, since this sandbox has no JDK (see the Step 5/6 DECISIONS entry).
google-api-client         = "2.9.0"
google-oauth-client-jetty = "1.39.0"
google-api-services-gmail    = "v1-rev20260525-2.0.0"
google-api-services-calendar = "v3-rev20260225-2.0.0"

[libraries]
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-coroutines-swing   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing",   version.ref = "coroutines" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core                = { module = "io.ktor:ktor-client-core",                version.ref = "ktor" }
ktor-client-cio                 = { module = "io.ktor:ktor-client-cio",                 version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging             = { module = "io.ktor:ktor-client-logging",             version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Test-only: a fake HttpClient engine so GeminiStt/GeminiTts's fallback-key
# logic (D-086) can be verified against scripted responses rather than a live
# Gemini call. Never a main-source dependency.
ktor-client-mock                = { module = "io.ktor:ktor-client-mock",                 version.ref = "ktor" }

sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
icu4j       = { module = "com.ibm.icu:icu4j",      version.ref = "icu4j" }
anthropic   = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }

slf4j-api        = { module = "org.slf4j:slf4j-api",         version.ref = "slf4j" }
logback-classic  = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

google-api-client            = { module = "com.google.api-client:google-api-client",         version.ref = "google-api-client" }
google-oauth-client-jetty    = { module = "com.google.oauth-client:google-oauth-client-jetty", version.ref = "google-oauth-client-jetty" }
google-api-services-gmail    = { module = "com.google.apis:google-api-services-gmail",    version.ref = "google-api-services-gmail" }
google-api-services-calendar = { module = "com.google.apis:google-api-services-calendar", version.ref = "google-api-services-calendar" }

junit-jupiter        = { module = "org.junit.jupiter:junit-jupiter",        version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "6.1.3" }

[bundles]
ktor-client = [
    "ktor-client-core",
    "ktor-client-cio",
    "ktor-client-content-negotiation",
    "ktor-client-logging",
    "ktor-serialization-kotlinx-json",
]

[plugins]
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",           version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# id, not module - both are Gradle plugin coordinates, not library jars.
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-compose        = { id = "org.jetbrains.compose", version.ref = "compose" }
