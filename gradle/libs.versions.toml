# Single source of truth for every dependency version.
# R7 analogue for the build: versions live here, never inline in a build script.

[versions]
kotlin              = "2.4.10"
coroutines          = "1.11.0"
serialization       = "1.9.0"
ktor                = "3.5.2"
slf4j               = "2.0.17"
logback             = "1.6.3"
junit               = "6.1.3"
sqlite              = "3.53.4.0"
# Pinned to the version transliteration was validated against (D-029). Any-Latn
# on Telugu/Devanagari was verified before this dependency was accepted.
icu4j               = "77.1"
# Official Anthropic SDK for the JVM. Kotlin uses the Java SDK. Supersedes
# ARCHITECTURE.md section 7's "Ktor" for the Claude transport - see D-044.
anthropic           = "2.59.0"

[libraries]
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-coroutines-swing   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing",   version.ref = "coroutines" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core                = { module = "io.ktor:ktor-client-core",                version.ref = "ktor" }
ktor-client-cio                 = { module = "io.ktor:ktor-client-cio",                 version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging             = { module = "io.ktor:ktor-client-logging",             version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
icu4j       = { module = "com.ibm.icu:icu4j",      version.ref = "icu4j" }
anthropic   = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }

slf4j-api        = { module = "org.slf4j:slf4j-api",         version.ref = "slf4j" }
logback-classic  = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-jupiter        = { module = "org.junit.jupiter:junit-jupiter",        version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "6.1.3" }

[bundles]
ktor-client = [
    "ktor-client-core",
    "ktor-client-cio",
    "ktor-client-content-negotiation",
    "ktor-client-logging",
    "ktor-serialization-kotlinx-json",
]

[plugins]
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",           version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
