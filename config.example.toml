# Second Brain — configuration template
#
# COPY THIS FILE, DO NOT EDIT IT IN PLACE.
#
#   Windows:  copy config.example.toml %USERPROFILE%\.secondbrain\config.toml
#   macOS/Linux:  cp config.example.toml ~/.secondbrain/config.toml
#
# Then fill in the two keys marked REQUIRED.
#
# config.toml is in .gitignore and must never be committed (EC-G4). This file —
# config.example.toml — is committed and must never contain a real key.
#
# Every value here can also be supplied as an environment variable, which wins
# over the file:  SECONDBRAIN_<SECTION>_<KEY>  e.g. SECONDBRAIN_STT_API_KEY.
#
# R7: every cap and threshold in the system lives in this file. If you find a
# number hardcoded in Kotlin or written into a prompt, that is a bug.


# ─────────────────────────────────────────────────────────────────────────────
[paths]
# Root for the vault, index.db, app.db, sessions and logs.
# "~" is expanded against the user home — Windows has no shell expansion for it.
root = "~/.secondbrain"


# ─────────────────────────────────────────────────────────────────────────────
[stt]
# Gemini. REQUIRED — both of these.
#
# EC-G3: the model id lives here, never in code. A 404 from Gemini names this key.
# The exact model string is spike S1.1; confirm it before trusting this default.
model   = "gemini-2.5-flash"
api_key = ""                                   # REQUIRED  <-- your Gemini API key

base_url = "https://generativelanguage.googleapis.com"

# EC-V6: above this, audio must go through the Files API instead of inline
# base64. The real cutover is a spike S1.1 answer.
inline_limit_bytes = 18000000

# E8: STT is read-only and idempotent, so retrying is correct. This is NOT the
# R5 no-auto-retry rule, which governs irreversible actions only.
max_attempts       = 3
initial_backoff_ms = 500
request_timeout_ms = 60000


# ─────────────────────────────────────────────────────────────────────────────
[tts]
# Kokoro. REQUIRED — model, voice and base_url.
#
# STATUS: the endpoint contract is spike S1.2 and is NOT yet confirmed. The
# client implements the OpenAI-compatible POST /v1/audio/speech shape that
# kokoro-fastapi and the common hosted deployments expose. If your provider
# differs, this section and KokoroTts.kt both change.
model    = "kokoro"
voice    = "af_heart"
base_url = ""                                  # REQUIRED  <-- e.g. http://localhost:8880
api_key  = ""                                  # optional; sent as a bearer token

# The JVM ships no MP3 decoder, so "wav" (or "pcm") is required unless you add
# a decode dependency. Asking for mp3 fails with a message naming this key.
response_format = "wav"
speed           = 1.0

max_attempts       = 3
initial_backoff_ms = 500
request_timeout_ms = 60000

# EC-T3: Kokoro cold start is audible dead air. Play a soft cue after this long.
thinking_cue_after_ms = 1500

# EC-T4: when the endpoint is unreachable, speak through the local platform
# voice (Windows SAPI) rather than failing silently.
fallback_enabled = true


# ─────────────────────────────────────────────────────────────────────────────
[audio]
sample_rate_hz = 16000

# Substring match against the OS device name, case-insensitive. Leave empty for
# the system default. Unplugging a matched device falls back automatically (EC-V9).
# On this laptop the options are:
#   capture : "Microphone (Realtek(R) Audio)" | "Headset (EarPods)"
#   playback: "Speakers (Realtek(R) Audio)"   | "Headset (EarPods)"
preferred_capture_device  = ""
preferred_playback_device = ""

capture_chunk_ms  = 50
# EC-V3: playback writes in slices this small so stop() can cut audio inside
# 100 ms. Raising this directly degrades barge-in responsiveness.
playback_chunk_ms = 40


# ─────────────────────────────────────────────────────────────────────────────
[gate]
# PUSH_TO_TALK | ENERGY_VAD
# PUSH_TO_TALK is the default and the only validated mode. ENERGY_VAD is built
# but its threshold is unmeasured (E13) — EC-V2 exists because energy
# endpointing cuts people off mid-sentence.
mode = "PUSH_TO_TALK"

# EC-V1: below EITHER of these, the recording is discarded with zero API cost.
min_utterance_ms = 400
# EC-V6 / E6: hard ceiling. On hitting it, capture stops and what we have is
# transcribed — truncating a thought beats losing it.
max_utterance_ms = 60000

# E4: the noise floor is MEASURED at startup (see calibration_ms) and cached in
# ~/.secondbrain/calibration.json. This is the margin above that floor which
# counts as speech. Raise it in a noisy room, lower it if quiet speech is dropped.
energy_margin_db = 12.0
calibration_ms   = 500

# ENERGY_VAD only. EC-V2 says 1200 ms, not 500 — a mid-sentence pause must not
# endpoint the utterance.
vad_silence_timeout_ms = 1200

# ── EC-V3 barge-in ──
# KEYPRESS | ENERGY | DISABLED
#
# E3: KEYPRESS is the default because there is no acoustic echo cancellation
# anywhere in the JVM. With mic and speaker on one headset, ENERGY makes the
# microphone hear our own TTS and the assistant interrupts itself in a loop.
barge_in = "KEYPRESS"

# ENERGY only: ignore the first N ms after playback starts.
barge_in_grace_ms = 300
# ENERGY only: by default it additionally requires capture and playback to be
# physically different devices. Do not set this true without reading E3.
allow_energy_barge_in_same_device = false


# ─────────────────────────────────────────────────────────────────────────────
[sessions]
# E1. ARCHITECTURE.md §2 says sessions rotate at 30 days; Step 1's build list
# reads as "delete the WAV once the transcript commits". Both are expressible.
#
# The default keeps the audio, because it is the only dataset for measuring STT
# accuracy on real Indian-English and code-switched speech — which is the whole
# point of Step 1. Swept at startup, not on a timer.
retention_days = 30

# When true, the WAV is deleted the moment its transcript commits. R10 forbids
# deleting it any earlier under any setting, and FAILED/EMPTY audio is always
# kept regardless of this flag.
delete_wav_on_commit = false


# ─────────────────────────────────────────────────────────────────────────────
[speech]
# EC-T2: hard cap on spoken output, truncated at a sentence boundary. A prompt
# saying "keep it short" is not a cap (R7).
max_speech_seconds = 60


# ─────────────────────────────────────────────────────────────────────────────
[vault]
# R7: every vault threshold lives here. D-007 is explicit that the Folder Guard
# numbers are guesses to be tuned against 20 real captures in Step 3, which only
# works if they are config rather than code.

# ── Folder Guard (§5 WF-1, EC-N6) ──
# score = 0.6 * jaccard(tokens) + 0.4 * (1 - normalisedLevenshtein(slug))
# At or above this, a proposed folder is rejected as SIMILAR and the model is
# told to reuse the existing one.
#
# Before you tune this: single-word folder names score either ~0.95 (same
# concept) or below ~0.40 (different concept), so no value between 0.45 and 0.90
# changes their verdict. There is a test asserting exactly that. The threshold
# only bites on multi-word names such as "Second Brain" vs "Second Brain UI".
folder_similarity_threshold = 0.72
folder_jaccard_weight       = 0.6

# Deepest folder allowed. 1 is a top-level folder.
max_folder_depth = 3
# A new top-level folder is refused once this many exist. The Folder Guard panel
# in the dashboard shows "7 / 12" against this number.
max_top_level_folders = 12

# ── Links (EC-N7, EC-N8) ──
# A [[wikilink]] resolves only at or above this similarity; below it the link is
# left dangling, because a wrong link is worse than no link. An ambiguous tie
# also stays dangling, with both candidates recorded.
link_fuzzy_threshold = 0.85

# ── Slugs (EC-N1, EC-N2) ──
# Maximum filename length before ".md". Titles are transliterated to ASCII, so
# "బ్లూప్రింట్ లెన్స్" becomes "bluprint-lens"; the frontmatter title keeps the
# original script.
max_slug_length = 80

# ── vault_tree (EC-A5) ──
# Depth returned by default, and the point past which a folder reports a count
# instead of a listing, so a 2000-note vault cannot blow the context.
tree_default_depth      = 3
tree_folder_listing_cap = 20

# ── FileWatcher (EC-N10) ──
# Coalescing window for filesystem events. One atomic write emits a burst of
# four events; this collapses them into a single re-index.
watch_debounce_ms = 300

# ── AtomicWriter (EC-N4) ──
# ATOMIC_MOVE fails with AccessDeniedException on Windows whenever another handle
# holds the target open, and Defender, the Search Indexer and the dashboard
# reader all do. Verified. Retry, then fall back to a non-atomic replace.
atomic_move_attempts   = 5
atomic_move_backoff_ms = 40


# ─────────────────────────────────────────────────────────────────────────────
[agent]
# Claude. REQUIRED for Step 3 onward.
#
# EC-G3: the model id lives here, never in code. A 404 names this key.
model   = "claude-opus-5"
api_key = ""                                   # REQUIRED  <-- your Anthropic API key

# Model used for rolling summaries and phase carry-over. Same model by default so
# there is one cache namespace; a summary call is a one-shot with its own prefix
# and will not see cache hits either way.
summary_model = "claude-opus-5"

# Thinking is ON by default on Opus 5 and thinking tokens bill as OUTPUT.
# `budget_tokens` returns a 400 on this model - depth is controlled by `effort`.
thinking_enabled = true
# low | medium | high | xhigh | max
effort     = "high"
max_tokens = 8192

# ── EC-A1 the caps ──
# Section 4 says "12 tool calls per turn", which is ambiguous once one response
# can carry several tool_use blocks. Round-trips and executions are capped
# separately: 12 round-trips of N parallel calls each is otherwise unbounded.
max_iterations       = 12
max_tool_executions  = 24
# EC-A3: attempts allowed to correct an unknown tool or a bad schema before the
# loop stops calling tools and forces a text reply.
max_self_corrections = 2

# ── EC-A7 ──
max_attempts       = 3
initial_backoff_ms = 1000
request_timeout_ms = 120000

# ── R8 / EC-A6 context ──
# Turns kept verbatim before older ones collapse into a rolling summary. A turn is
# one utterance plus everything the assistant did about it, not one message. This
# is the number in the UI's "TURN 3 / 8" chip.
context_window_turns = 8

# ── Prompt caching ──
# The system prompt plus eight tool schemas is a large stable prefix resent on
# every iteration, and cache reads cost 0.1x. Turning this off roughly multiplies
# the prefix cost by ten, up to twelve times per capture - the per-capture figure
# the Step 3 exit criterion records is only meaningful with it on.
cache_enabled = true

# A cache breakpoint walks back at most 20 content blocks. A twelve-call turn is
# 24 blocks (12 tool_use + 12 tool_result), which pushes the previous entry out of
# the lookback and silently rewrites the whole conversation at the write price, on
# every request, with byte-identical payloads. Intermediate breakpoints every N
# blocks keep it inside the window.
cache_block_interval = 15

# Voice meets every criterion for pre-warming: user-visible first-request latency,
# a large shared prefix, and a quiet moment at startup. Costs one cache write and
# removes the cold-write penalty from the first capture.
prewarm_cache = true

# ── EC-G2 cost ceiling ──
# Checked BEFORE a new utterance starts, never mid-turn: tripping at iteration 7
# of a capture would abandon a thought, which is what EC-V7 exists to prevent.
# Continuing past the ceiling is confirmed by SPEECH, not a click - R9 allows
# exactly two typing exceptions and this is neither of them.
session_usd_ceiling = 2.00
session_usd_warn_at = 0.75

# ── Pricing, per million tokens ──
# In config rather than in code so switching models forces you to look at the
# price, and a stale price is visible. These live under [agent] rather than their
# own section because config.toml uses single-level sections.
#
# Claude Opus 5 as of 2026-09-01. Verify before trusting: the Step 3 exit
# criterion records a per-capture USD figure that becomes the budget for Steps 4
# through 7, so a wrong number here corrupts all of them.
#
# NOTE: `usage.input_tokens` from the API is the UNCACHED REMAINDER only. Total
# prompt = input_tokens + cache_creation + cache_read, each priced differently,
# which is why there are four numbers here and not two.
input_usd_per_mtok  = 5.00
output_usd_per_mtok = 25.00
# Cache writes are 1.25x base input at the 5-minute TTL (2x at 1 hour).
cache_write_multiplier = 1.25
# Cache reads are ~0.1x base input.
cache_read_multiplier  = 0.1
